// save.js
// Persistance localStorage: diffs de blocs par chunk + état du joueur.
// On ne stocke que les modifications par rapport à la génération procédurale.

class Save {
  constructor(seed) {
    this.seed = seed;
    this.prefix = `mc_${seed}_`;
    this.pending = new Set(); // chunks à écrire (clés "cx,cz")
    this.pendingChunks = new Map();
  }

  _chunkKey(cx, cz) { return `${this.prefix}chunk_${cx}_${cz}`; }

  queueChunk(chunk) {
    const k = chunk.cx + ',' + chunk.cz;
    this.pending.add(k);
    this.pendingChunks.set(k, chunk);
  }

  saveChunkNow(chunk) {
    if (!chunk.modified || chunk.modified.size === 0) return;
    try {
      const arr = [];
      for (const [idx, id] of chunk.modified) arr.push(idx, id);
      localStorage.setItem(this._chunkKey(chunk.cx, chunk.cz), JSON.stringify(arr));
      const k = chunk.cx + ',' + chunk.cz;
      this.pending.delete(k); this.pendingChunks.delete(k);
    } catch (e) { /* quota dépassé: ignorer */ }
  }

  flushPending() {
    for (const [, chunk] of this.pendingChunks) this.saveChunkNow(chunk);
    this.pending.clear(); this.pendingChunks.clear();
  }

  loadChunkDiff(cx, cz) {
    try {
      const raw = localStorage.getItem(this._chunkKey(cx, cz));
      if (!raw) return null;
      const arr = JSON.parse(raw);
      const map = new Map();
      for (let i = 0; i < arr.length; i += 2) map.set(arr[i], arr[i + 1]);
      return map;
    } catch (e) { return null; }
  }

  savePlayer(player, inventory, dayNight) {
    try {
      const data = {
        seed: this.seed,
        pos: [player.position.x, player.position.y, player.position.z],
        yaw: player.yaw, pitch: player.pitch,
        health: player.health, hunger: player.hunger, saturation: player.saturation,
        xp: player.xp, level: player.level,
        creative: player.creative, viewMode: player.viewMode,
        time: dayNight.getTime(),
        inventory: inventory.serialize(),
      };
      localStorage.setItem(this.prefix + 'player', JSON.stringify(data));
      // référencer le monde
      const worlds = JSON.parse(localStorage.getItem('mc_worlds') || '{}');
      worlds[this.seed] = { seed: this.seed, savedAt: Date.now() };
      localStorage.setItem('mc_worlds', JSON.stringify(worlds));
    } catch (e) { /* ignorer */ }
  }

  loadPlayer() {
    try {
      const raw = localStorage.getItem(this.prefix + 'player');
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  static listWorlds() {
    try { return JSON.parse(localStorage.getItem('mc_worlds') || '{}'); }
    catch (e) { return {}; }
  }

  clear() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(this.prefix)) keys.push(k);
    }
    for (const k of keys) localStorage.removeItem(k);
  }
}


// ===================== main.js =====================

// main.js
// Point d'entrée: initialise Three.js, orchestre la boucle de jeu, gère le
// casser/poser de blocs, les interactions, les mobs, les drops, la caméra,
// les écrans et la sauvegarde.


// ----- Réglages persistants -------------------------------------------------
const DEFAULT_SETTINGS = { renderDistance: 6, sensitivity: 0.0022, volume: 0.5, fov: 70, creative: false };
function loadSettings() {
  try { return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(localStorage.getItem('mc_settings') || '{}')); }
  catch (e) { return { ...DEFAULT_SETTINGS }; }
}
function saveSettings(s) { try { localStorage.setItem('mc_settings', JSON.stringify(s)); } catch (e) {} }

class Game {
  constructor() {
    this.settings = loadSettings();
    this.state = 'title';        // title | loading | playing | paused | dead
    this.clock = new THREE.Clock();
    this.mobs = [];
    this.drops = [];
    this.arrows = [];
    this.chests = new Map();
    this.furnaces = new Map();
    this.breakProgress = 0;
    this.breakTarget = null;
    this.spawnTimer = 0;
    this.autosaveTimer = 0;
    this.fps = 0; this.fpsAccum = 0; this.fpsFrames = 0;

    this._initThree();
    this._initUI();
    this.ui.showTitle(() => this.startGame(), () => this.openSettings('title'));
    this._loop = this._loop.bind(this);
    requestAnimationFrame(this._loop);
    window.addEventListener('beforeunload', () => this.saveAll());
    window.addEventListener('resize', () => this._onResize());
  }

  // ---------- Three.js ----------
  _initThree() {
    this.canvas = document.getElementById('game');
    this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: false });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    this.renderer.setSize(window.innerWidth, window.innerHeight);

    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.Fog(0x88bbff, 60, this.settings.renderDistance * CHUNK_SIZE);
    this.camera = new THREE.PerspectiveCamera(this.settings.fov, window.innerWidth / window.innerHeight, 0.1, 1000);

    this.atlas = createTextureAtlas(THREE);
    const tex = this.atlas.texture;
    this.materials = {
      opaque: new THREE.MeshBasicMaterial({ map: tex, vertexColors: true, alphaTest: 0.5, side: THREE.DoubleSide }),
      cross: new THREE.MeshBasicMaterial({ map: tex, vertexColors: true, alphaTest: 0.4, side: THREE.DoubleSide }),
      water: new THREE.MeshBasicMaterial({ map: tex, vertexColors: true, transparent: true, opacity: 0.72, depthWrite: false, side: THREE.DoubleSide }),
    };

    this.dayNight = new DayNight(this.scene);

    // surbrillance du bloc visé
    this.highlight = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(1.002, 1.002, 1.002)),
      new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4 }));
    this.highlight.visible = false;
    this.scene.add(this.highlight);

    // overlay de fissures
    const crackTex = this.atlas.crackTexture;
    crackTex.wrapS = crackTex.wrapT = THREE.RepeatWrapping;
    crackTex.repeat.set(0.1, 1);
    this.crackMat = new THREE.MeshBasicMaterial({ map: crackTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1 });
    this.crackMesh = new THREE.Mesh(new THREE.BoxGeometry(1.003, 1.003, 1.003), this.crackMat);
    this.crackMesh.visible = false;
    this.scene.add(this.crackMesh);

    // avatar joueur (visible en vue 3e personne)
    this.avatar = new THREE.Group();
    const skin = new THREE.MeshLambertMaterial({ color: 0x3a6ea5 });
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshLambertMaterial({ color: 0xd8a878 }));
    head.position.y = 1.55;
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.7, 0.3), skin); body.position.y = 1.0;
    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.7, 0.25), new THREE.MeshLambertMaterial({ color: 0x33408a })); legL.position.set(0.14, 0.35, 0);
    const legR = legL.clone(); legR.position.x = -0.14;
    this.avatar.add(head, body, legL, legR);
    this.avatar.visible = false;
    this.scene.add(this.avatar);
  }

  _onResize() {
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  }

  _initUI() {
    this.sound = new Sound();
    this.sound.setVolume(this.settings.volume);
    this.inventory = new Inventory();
    this.ui = new UI(document.getElementById('ui'), this.inventory, this.sound, {
      onClosePanel: () => { if (this.state === 'playing') this.canvas.requestPointerLock(); },
      onReset: () => this.resetWorld(),
    });
  }

  // ---------- Démarrage du monde ----------
  startGame() {
    this.ui.showLoading('Generating world...');
    setTimeout(() => this._generateWorld(), 50);
  }

  _generateWorld() {
    const saved = this._loadedPlayerData = (() => {
      // tenter de charger le dernier monde
      const worlds = Save.listWorlds();
      const seeds = Object.keys(worlds);
      if (seeds.length) { const s = new Save(parseInt(seeds[0])); const p = s.loadPlayer(); if (p) return { seed: p.seed, player: p }; }
      return null;
    })();

    const seed = saved ? saved.seed : Math.floor(Math.random() * 1e9);
    this.save = new Save(seed);
    this.player = new Player();
    this.player.creative = this.settings.creative;

    this.world = new World(this.scene, seed, this.atlas, this.materials, this.save);
    this.world.renderDistance = this.settings.renderDistance;

    // pré-générer la zone de spawn
    let spawnX = 0, spawnZ = 0;
    if (saved && saved.player) {
      spawnX = Math.floor(saved.player.pos[0]); spawnZ = Math.floor(saved.player.pos[2]);
    }
    const ccx = Math.floor(spawnX / CHUNK_SIZE), ccz = Math.floor(spawnZ / CHUNK_SIZE);
    for (let dx = -2; dx <= 2; dx++)
      for (let dz = -2; dz <= 2; dz++)
        this.world.generateChunk(ccx + dx, ccz + dz);

    // état joueur
    if (saved && saved.player) {
      const p = saved.player;
      this.player.position.set(p.pos[0], p.pos[1], p.pos[2]);
      this.player.yaw = p.yaw; this.player.pitch = p.pitch;
      this.player.health = p.health; this.player.hunger = p.hunger; this.player.saturation = p.saturation || 5;
      this.player.xp = p.xp || 0; this.player.level = p.level || 0;
      this.player.creative = p.creative || this.settings.creative;
      this.player.viewMode = p.viewMode || 0;
      this.inventory.deserialize(p.inventory);
      this.dayNight.setTime(p.time || 0);
    } else {
      const y = this.world.surfaceHeight(0, 0);
      this.player.position.set(0.5, y + 1, 0.5);
      // kit de départ
      this.inventory.addItem(I.WOOD_PICK, 1);
      this.inventory.addItem(I.WOOD_AXE, 1);
      this.inventory.addItem(B.TORCH, 16);
      this.inventory.addItem(B.PLANKS_OAK, 32);
    }

    this.controls = new Controls(this.canvas, this.player, {
      onAction: (name, val) => this._onAction(name, val),
      onScroll: (dir) => { this.inventory.selected = (this.inventory.selected + dir + 9) % 9; },
      onUnlock: () => { if (this.state === 'playing' && !this.ui.open) this.pause(); },
    });
    this.player.onFootstep = (b) => this.sound.footstep(b);
    this.player.onHurt = () => this.sound.hurt();

    this.ui.hideScreen();
    this.state = 'playing';
    this.sound.init(); this.sound.resume();
    this.canvas.requestPointerLock();
  }

  resetWorld() {
    const worlds = Save.listWorlds();
    for (const seed of Object.keys(worlds)) new Save(parseInt(seed)).clear();
    localStorage.removeItem('mc_worlds');
    location.reload();
  }

  // ---------- Actions ----------
  _onAction(name, val) {
    if (this.state === 'dead' && name !== 'escape') return;
    switch (name) {
      case 'hotbar': this.inventory.selected = val; break;
      case 'inventory':
        if (this.ui.open) { this.ui.closePanel(); if (this.state === 'playing') this.canvas.requestPointerLock(); }
        else if (this.state === 'playing') { this.ui.openInventory(4); document.exitPointerLock(); }
        break;
      case 'escape':
        if (this.ui.open) { this.ui.closePanel(); if (this.state === 'playing') this.canvas.requestPointerLock(); }
        else if (this.state === 'paused') this.resume();
        else if (this.state === 'playing') this.pause();
        break;
      case 'debug': this.ui.setDebug(!this.ui.debugOn); break;
      case 'view': this.player.viewMode = (this.player.viewMode + 1) % 3; break;
      case 'fly': if (this.player.creative) this.player.flying = !this.player.flying; break;
      case 'attack': this._tryHitMob(); break;
      case 'use': this._useAction(); break;
      case 'pick': this._pickBlock(); break;
      case 'drop': this._dropSelected(); break;
    }
  }

  pause() { this.state = 'paused'; this.controls.reset(); this.ui.showPause(() => this.resume(), () => this.openSettings('pause'), () => this.saveAndQuit()); }
  resume() { this.state = 'playing'; this.ui.hideScreen(); this.canvas.requestPointerLock(); }
  openSettings(from) {
    this.ui.showSettings(this.settings, (k, v) => this._applySetting(k, v), () => {
      if (from === 'title') this.ui.showTitle(() => this.startGame(), () => this.openSettings('title'));
      else this.ui.showPause(() => this.resume(), () => this.openSettings('pause'), () => this.saveAndQuit());
    });
  }
  _applySetting(k, v) {
    this.settings[k] = v; saveSettings(this.settings);
    if (k === 'renderDistance' && this.world) { this.world.renderDistance = v; this.scene.fog.far = v * CHUNK_SIZE; }
    if (k === 'sensitivity' && this.controls) this.controls.sensitivity = v;
    if (k === 'volume') this.sound.setVolume(v);
    if (k === 'fov') { this.camera.fov = v; this.camera.updateProjectionMatrix(); }
    if (k === 'creative' && this.player) this.player.creative = v;
  }
  saveAndQuit() { this.saveAll(); this.state = 'title'; document.exitPointerLock(); this._clearWorld(); this.ui.showTitle(() => this.startGame(), () => this.openSettings('title')); }
  _clearWorld() {
    for (const m of this.mobs) this.scene.remove(m.mesh);
    for (const d of this.drops) this.scene.remove(d.mesh);
    for (const a of this.arrows) this.scene.remove(a.mesh);
    this.mobs = []; this.drops = []; this.arrows = [];
    if (this.world) for (const c of this.world.chunks.values()) { this.scene.remove(c.group); c.dispose(); }
    if (this.world) this.world.chunks.clear();
  }

  // ---------- Casser / poser ----------
  _raycastBlock() {
    return this.world.raycast(this.player.eyePosition(), this.player.lookVector(), 5);
  }

  _breakTime(blockId, heldId) {
    const def = getBlockDef(blockId);
    if (def.hardness < 0) return Infinity;
    if (this.player.creative) return 0;
    let base = def.hardness * 1.5;
    const tool = getTool(heldId);
    if (def.tool && tool && tool.type === def.tool) {
      const speeds = [2, 4, 6, 8];
      base /= speeds[tool.level] || 2;
    } else if (def.tool) base *= 1.5;
    return Math.max(0.05, base);
  }

  _dropFor(blockId, heldId) {
    const def = getBlockDef(blockId);
    const tool = getTool(heldId);
    if (def.tool === 'pickaxe' && !(tool && tool.type === 'pickaxe')) return null; // mauvais outil
    if (blockId === B.COAL_ORE) return [I.COAL, 1];
    if (blockId === B.DIAMOND_ORE) return [I.DIAMOND, 1];
    if (blockId === B.REDSTONE_ORE) return [I.REDSTONE, 4];
    if (blockId === B.LAPIS_ORE) return [I.LAPIS, 5];
    const d = def.drop;
    if (d === 0 || d == null) return null;
    return [d, def.dropCount || 1];
  }

  _updateBreaking(dt) {
    const target = this._raycastBlock();
    this.highlight.visible = !!target;
    if (target) this.highlight.position.set(target.block.x + 0.5, target.block.y + 0.5, target.block.z + 0.5);

    if (!this.controls.breaking || !target || this.ui.open) {
      this.breakProgress = 0; this.breakTarget = null; this.crackMesh.visible = false; return;
    }
    const key = target.block.x + ',' + target.block.y + ',' + target.block.z;
    if (this.breakTarget !== key) { this.breakTarget = key; this.breakProgress = 0; }

    const held = this.inventory.selectedStack();
    const time = this._breakTime(target.id, held ? held.id : 0);
    if (time === Infinity) { this.crackMesh.visible = false; return; }

    this.breakProgress += dt / time;
    if (Math.random() < dt * 8) this.sound.dig(target.id);

    if (this.breakProgress >= 1) {
      this._breakBlock(target, held);
      this.breakProgress = 0; this.breakTarget = null; this.crackMesh.visible = false;
    } else {
      const stage = Math.min(9, Math.floor(this.breakProgress * 10));
      this.crackMat.map.offset.x = stage * 0.1;
      this.crackMesh.position.set(target.block.x + 0.5, target.block.y + 0.5, target.block.z + 0.5);
      this.crackMesh.visible = true;
    }
  }

  _breakBlock(target, held) {
    const id = target.id;
    const drop = this._dropFor(id, held ? held.id : 0);
    this.world.setBlock(target.block.x, target.block.y, target.block.z, B.AIR);
    this.sound.break(id);
    if (drop && !this.player.creative) {
      this._spawnDrop(drop[0], drop[1], { x: target.block.x + 0.5, y: target.block.y + 0.4, z: target.block.z + 0.5 });
    }
    // dégât d'outil
    if (held && held.id >= 256 && getTool(held.id)) this.inventory.damageSelected();
  }

  _useAction() {
    if (this.ui.open || this.state !== 'playing') return;
    const target = this._raycastBlock();
    // interaction sur le bloc visé
    if (target) {
      const def = getBlockDef(target.id);
      if (def.interact === 'craft') { this.ui.openInventory(9); document.exitPointerLock(); return; }
      if (def.interact === 'chest') { this.ui.openChest(this._chestAt(target.block)); document.exitPointerLock(); return; }
      if (def.interact === 'furnace') { this.ui.openFurnace(this._furnaceAt(target.block)); document.exitPointerLock(); return; }
    }
    const held = this.inventory.selectedStack();
    if (!held) return;

    // manger
    const food = getFood(held.id);
    if (food && this.player.hunger < this.player.maxHunger) {
      this.player.eat(food); this.inventory.removeFromSelected(1); this.sound.click(); return;
    }
    // poser un bloc
    if (isBlockItem(held.id) && target) {
      const p = target.place;
      if (this._canPlace(p, held.id)) {
        this.world.setBlock(p.x, p.y, p.z, held.id);
        this.sound.place(held.id);
        if (!this.player.creative) this.inventory.removeFromSelected(1);
      }
    }
  }

  _canPlace(p, id) {
    if (this.world.getBlock(p.x, p.y, p.z) !== B.AIR) return false;
    if (!getBlockDef(id).solid) return true;
    // pas de chevauchement avec le joueur
    const a = this.player.aabb();
    if (a.maxX > p.x && a.minX < p.x + 1 && a.maxY > p.y && a.minY < p.y + 1 && a.maxZ > p.z && a.minZ < p.z + 1) return false;
    // pas sur un mob
    for (const m of this.mobs) {
      if (Math.floor(m.position.x) === p.x && Math.floor(m.position.z) === p.z && Math.abs(m.position.y - p.y) < 2) return false;
    }
    return true;
  }

  _pickBlock() {
    const t = this._raycastBlock();
    if (!t) return;
    // sélectionner ce bloc dans la hotbar (créatif) ou s'il est possédé
    for (let i = 0; i < 9; i++) if (this.inventory.slots[i] && this.inventory.slots[i].id === t.id) { this.inventory.selected = i; return; }
    if (this.player.creative) { this.inventory.slots[this.inventory.selected] = { id: t.id, count: 1 }; }
  }

  _dropSelected() {
    const s = this.inventory.selectedStack();
    if (!s) return;
    const dir = this.player.lookVector();
    const pos = this.player.eyePosition();
    const d = this._spawnDrop(s.id, 1, { x: pos.x + dir.x, y: pos.y, z: pos.z + dir.z });
    if (d) { d.velocity.set(dir.x * 6, 3, dir.z * 6); d.pickupDelay = 1.2; }
    this.inventory.removeFromSelected(1);
  }

  _spawnDrop(id, count, pos) {
    if (this.drops.length > 200) return null;
    const d = new DroppedItem(this.world, id, count, pos);
    this.drops.push(d); this.scene.add(d.mesh);
    return d;
  }

  // ---------- Coffres / fours ----------
  _chestAt(b) {
    const k = b.x + ',' + b.y + ',' + b.z;
    if (!this.chests.has(k)) this.chests.set(k, new Array(27).fill(null));
    return this.chests.get(k);
  }
  _furnaceAt(b) {
    const k = b.x + ',' + b.y + ',' + b.z;
    if (!this.furnaces.has(k)) this.furnaces.set(k, new Array(3).fill(null));
    return this.furnaces.get(k);
  }
  _tickFurnace(dt) {
    const f = this.ui.furnaceData; if (!f) return;
    const input = f[0], fuel = f[1];
    const recipe = input ? SMELTING[input.id] : null;
    if (recipe && fuel && (!f[2] || (f[2].id === recipe && f[2].count < 64))) {
      f.progress = (f.progress || 0) + dt;
      if (f.progress >= 6) {
        f.progress = 0;
        input.count--; if (input.count <= 0) f[0] = null;
        fuel.count--; if (fuel.count <= 0) f[1] = null;
        if (f[2]) f[2].count++; else f[2] = { id: recipe, count: 1 };
        this.ui._refreshPanel();
      }
    } else f.progress = 0;
  }

  // ---------- Mobs ----------
  _tryHitMob() {
    if (this.ui.open || this.state !== 'playing') return;
    const eye = this.player.eyePosition();
    const look = this.player.lookVector();
    let best = null, bestT = 4;
    for (const m of this.mobs) {
      const dx = m.position.x - eye.x, dy = (m.position.y + m.size.height / 2) - eye.y, dz = m.position.z - eye.z;
      const t = dx * look.x + dy * look.y + dz * look.z;
      if (t < 0 || t > bestT) continue;
      const px = eye.x + look.x * t, py = eye.y + look.y * t, pz = eye.z + look.z * t;
      const dist = Math.hypot(px - m.position.x, py - (m.position.y + m.size.height / 2), pz - m.position.z);
      if (dist < m.size.width) { best = m; bestT = t; }
    }
    if (best) {
      const held = this.inventory.selectedStack();
      const tool = held ? getTool(held.id) : null;
      let dmg = 1;
      if (tool && tool.type === 'sword') dmg = 4 + tool.level * 1.5;
      else if (tool && tool.type === 'axe') dmg = 3 + tool.level;
      best.hurt(dmg, this.player.position);
      this.sound.mob(best.type, 1);
    }
  }

  shootArrow(mob, targetPos) {
    const origin = { x: mob.position.x, y: mob.position.y + mob.size.height * 0.8, z: mob.position.z };
    const dir = new THREE.Vector3(targetPos.x - origin.x, targetPos.y - origin.y, targetPos.z - origin.z).normalize();
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.5), new THREE.MeshBasicMaterial({ color: 0xcccccc }));
    mesh.position.set(origin.x, origin.y, origin.z);
    this.scene.add(mesh);
    this.arrows.push({ pos: new THREE.Vector3(origin.x, origin.y, origin.z), vel: dir.multiplyScalar(22), mesh, age: 0 });
    this.sound.bow();
  }

  explode(pos, radius) {
    this.sound.explode();
    const cx = Math.floor(pos.x), cy = Math.floor(pos.y), cz = Math.floor(pos.z);
    for (let x = -radius; x <= radius; x++)
      for (let y = -radius; y <= radius; y++)
        for (let z = -radius; z <= radius; z++) {
          if (x * x + y * y + z * z > radius * radius) continue;
          const bx = cx + x, by = cy + y, bz = cz + z;
          const id = this.world.getBlock(bx, by, bz);
          if (id !== B.AIR && id !== B.BEDROCK && getBlockDef(id).hardness >= 0)
            this.world.setBlock(bx, by, bz, B.AIR);
        }
    // dégâts de souffle
    const pd = this.player.position.distanceTo(pos);
    if (pd < radius + 2) this.player.takeDamage(Math.max(1, Math.floor((radius + 2 - pd) * 4)));
    for (const m of this.mobs) { const d = m.position.distanceTo(pos); if (d < radius + 2) m.hurt(Math.floor((radius + 2 - d) * 5), pos); }
    // flash
    const flash = new THREE.PointLight(0xffaa33, 5, 12); flash.position.copy(pos); this.scene.add(flash);
    setTimeout(() => this.scene.remove(flash), 150);
  }

  _updateMobs(dt) {
    const gameRef = { isDay: this.dayNight.isDay, isNight: this.dayNight.isNight, shootArrow: (m, t) => this.shootArrow(m, t), explode: (p, r) => this.explode(p, r) };
    for (let i = this.mobs.length - 1; i >= 0; i--) {
      const m = this.mobs[i];
      m.update(dt, this.player, gameRef);
      // sons d'ambiance occasionnels
      if (Math.random() < dt * 0.05) this.sound.mob(m.type, m.position.distanceTo(this.player.position));
      const far = m.position.distanceTo(this.player.position);
      const despawn = far > 80 || (far > 44 && this.mobs.length > 40);
      if (m.dead || despawn) {
        if (m.dead) {
          for (const [id, n] of m.rollDrops()) this._spawnDrop(id, n, m.position);
          this.sound.mob(m.type, far);
        }
        this.scene.remove(m.mesh); m.dispose(); this.mobs.splice(i, 1);
      }
    }
    // spawn
    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0) {
      this.spawnTimer = 2;
      trySpawn(this.world, this.mobs, this.player, this.scene, this.dayNight.dayFactor, this.dayNight.isNight, 50);
    }
  }

  _updateDrops(dt) {
    for (let i = this.drops.length - 1; i >= 0; i--) {
      const d = this.drops[i];
      d.update(dt, this.player, this.inventory);
      if (d.dead) { this.scene.remove(d.mesh); d.dispose(); this.drops.splice(i, 1); }
    }
  }

  _updateArrows(dt) {
    for (let i = this.arrows.length - 1; i >= 0; i--) {
      const a = this.arrows[i];
      a.age += dt;
      a.vel.y -= 12 * dt;
      a.pos.addScaledVector(a.vel, dt);
      a.mesh.position.copy(a.pos);
      a.mesh.lookAt(a.pos.clone().add(a.vel));
      let hit = getBlockDef(this.world.getBlock(Math.floor(a.pos.x), Math.floor(a.pos.y), Math.floor(a.pos.z))).solid;
      if (a.pos.distanceTo(this.player.position.clone().add(new THREE.Vector3(0, 1, 0))) < 0.8) { this.player.takeDamage(2); hit = true; }
      if (hit || a.age > 6) { this.scene.remove(a.mesh); a.mesh.geometry.dispose(); a.mesh.material.dispose(); this.arrows.splice(i, 1); }
    }
  }

  // ---------- Caméra ----------
  _updateCamera() {
    const eye = this.player.eyePosition();
    this.camera.rotation.order = 'YXZ';
    if (this.player.viewMode === 0) {
      this.camera.position.copy(eye);
      this.camera.rotation.y = this.player.yaw;
      this.camera.rotation.x = this.player.pitch;
      this.avatar.visible = false;
    } else {
      const dist = 4;
      const look = this.player.lookVector();
      const sign = this.player.viewMode === 1 ? -1 : 1;
      // reculer (ou avancer) en évitant de traverser un mur
      let d = dist;
      for (let s = 0.2; s <= dist; s += 0.2) {
        const px = eye.x + look.x * s * sign, py = eye.y + look.y * s * sign, pz = eye.z + look.z * s * sign;
        if (getBlockDef(this.world.getBlock(Math.floor(px), Math.floor(py), Math.floor(pz))).solid) { d = s - 0.2; break; }
      }
      this.camera.position.set(eye.x + look.x * d * sign, eye.y + look.y * d * sign, eye.z + look.z * d * sign);
      this.camera.rotation.y = this.player.yaw + (this.player.viewMode === 2 ? Math.PI : 0);
      this.camera.rotation.x = this.player.pitch * (this.player.viewMode === 2 ? -1 : 1);
      this.avatar.visible = true;
      this.avatar.position.copy(this.player.position);
      this.avatar.rotation.y = this.player.yaw + Math.PI;
    }
    // FOV sprint
    const targetFov = this.settings.fov + (this.player.input.sprint && this.player.input.forward ? 6 : 0);
    if (Math.abs(this.camera.fov - targetFov) > 0.1) { this.camera.fov += (targetFov - this.camera.fov) * 0.2; this.camera.updateProjectionMatrix(); }
  }

  // ---------- Boucle ----------
  saveAll() {
    if (!this.world) return;
    for (const c of this.world.chunks.values()) this.save.saveChunkNow(c);
    this.save.flushPending();
    this.save.savePlayer(this.player, this.inventory, this.dayNight);
  }

  _loop() {
    requestAnimationFrame(this._loop);
    let dt = this.clock.getDelta();
    if (dt > 0.1) dt = 0.1; // éviter les sauts après un lag

    // FPS
    this.fpsFrames++; this.fpsAccum += dt;
    if (this.fpsAccum >= 0.5) { this.fps = Math.round(this.fpsFrames / this.fpsAccum); this.fpsFrames = 0; this.fpsAccum = 0; }

    if (this.state === 'playing') {
      this.player.update(dt, this.world);
      this.world.update(this.player.position);
      this._updateBreaking(dt);
      this._updateMobs(dt);
      this._updateDrops(dt);
      this._updateArrows(dt);
      if (this.ui.furnaceData) this._tickFurnace(dt);
      this.sound.updateMusic(dt);

      this.autosaveTimer += dt;
      if (this.autosaveTimer > 30) { this.autosaveTimer = 0; this.saveAll(); }

      if (this.player.dead && this.state === 'playing') {
        this.state = 'dead'; this.sound.death(); document.exitPointerLock();
        this.ui.showDeath(() => { this.player.respawn(this.world, { x: 0, z: 0 }); this.state = 'playing'; this.ui.hideScreen(); this.canvas.requestPointerLock(); },
          () => this.saveAndQuit());
      }
    }

    if (this.world) {
      this.dayNight.update(dt, this.camera);
      // teinte jour/nuit appliquée globalement aux matériaux du monde
      const f = this.dayNight.dayFactor;
      const r = 0.6 + f * 0.4, g = 0.65 + f * 0.35, b = 0.7 + f * 0.3;
      this.materials.opaque.color.setRGB(f * r, f * g, f * b);
      this.materials.cross.color.copy(this.materials.opaque.color);
      this.materials.water.color.copy(this.materials.opaque.color);
      this._updateCamera();
      this.ui.updateHUD(this.player, this.world);
      if (this.ui.debugOn) this._updateDebug();
    }

    this.renderer.render(this.scene, this.camera);
  }

  _updateDebug() {
    const p = this.player.position;
    const biome = this.world.getBiomeAt(Math.floor(p.x), Math.floor(p.z));
    const t = this._raycastBlock();
    this.ui.updateDebug([
      `<b>Minecraft JS Clone</b>`,
      `FPS: ${this.fps}`,
      `XYZ: ${p.x.toFixed(1)} / ${p.y.toFixed(1)} / ${p.z.toFixed(1)}`,
      `Chunk: ${Math.floor(p.x / CHUNK_SIZE)}, ${Math.floor(p.z / CHUNK_SIZE)}`,
      `Biome: ${biome}`,
      `Chunks loaded: ${this.world.loadedChunkCount()}`,
      `Mobs: ${this.mobs.length}  Drops: ${this.drops.length}`,
      `Time: ${(this.dayNight.getTime() / 60).toFixed(1)}min  ${this.dayNight.isDay ? 'Day' : 'Night'}`,
      `Looking at: ${t ? `${t.id} (${getBlockDef(t.id).name})` : '-'}`,
    ]);
  }
}

// Lancer le jeu. Un script module chargé via un import CDN distant s'exécute
// APRÈS DOMContentLoaded; on ne peut donc pas se fier à cet événement. On
// vérifie l'état du document et on démarre immédiatement s'il est déjà prêt.
function boot() {
  try {
    const b = document.getElementById('boot'); if (b) b.remove();
    new Game();
  } catch (e) {
    const d = document.getElementById('err');
    if (d) { d.style.display = 'block'; d.textContent = 'ERREUR au démarrage: ' + (e && e.stack ? e.stack : e); }
    throw e;
  }
}
if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
</body>
